name: Trigger auto deployment for sms-webapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/sms-webapp-AutoDeployTrigger-4cd5e931-dd7d-410d-a7f3-7905dc3629ab.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.SMSWEBAPP_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: andycontainerhub.azurecr.io
          registryUsername: ${{ secrets.SMSWEBAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SMSWEBAPP_REGISTRY_PASSWORD }}
          containerAppName: sms-webapp
          resourceGroup: student-management-system-dev-rg
          imageToBuild: andycontainerhub.azurecr.io/sms-webapp:${{ github.sha }}
          
            

     

