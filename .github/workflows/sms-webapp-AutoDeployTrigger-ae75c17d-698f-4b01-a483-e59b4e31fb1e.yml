name: Trigger auto deployment for sms-webapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/sms-webapp-AutoDeployTrigger-ae75c17d-698f-4b01-a483-e59b4e31fb1e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SMSWEBAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SMSWEBAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SMSWEBAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: andycontainerhub.azurecr.io
          registryUsername: ${{ secrets.SMSWEBAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SMSWEBAPP_REGISTRY_PASSWORD }}
          containerAppName: sms-webapp
          resourceGroup: student-management-system-dev-rg
          imageToBuild: andycontainerhub.azurecr.io/sms-webapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


